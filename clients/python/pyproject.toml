[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxd-client"
version = "0.2.1"
description = "Python client for sandboxd, the WebAssembly sandbox for AI-agent code"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SoumyabrataNandi/Agent_SandBox"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandboxd_client = ["py.typed"]
