version: 1
name: full
description: Every section populated
limits:
  wall_clock: 1.5s
  fuel: 500M
  memory: 128mb
  stdout: 64KiB
  stderr: 4096
  artifact_count: 4
  artifact_bytes: 2MiB
  input_bytes: 8M
filesystem:
  inputs: /input/
  outputs: /results
  mount:
    - guest: /data
      host: "@HOST_DIR@"
      mode: ro
env:
  TZ: UTC
  LANG: C.UTF-8
network:
  allow_private_ips: false
  max_requests: 5
  max_response_bytes: 1MiB
  http:
    - { host: API.Example.com, port: 443, methods: [post, GET, get], path_prefix: /v1/ }
  tcp:
    - host: db.internal
      port: 5432
session:
  enabled: false
  idle_ttl: 10m
  max_sessions: 3
audit:
  log_code: true
