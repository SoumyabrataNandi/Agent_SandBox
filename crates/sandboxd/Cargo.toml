[package]
name = "sandboxd"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "sandboxd"
path = "src/main.rs"

[features]
# OTLP/HTTP export (metrics + a span per run); off by default.
otel = ["sandboxd-server/otel"]

[dependencies]
sandboxd-assets.workspace = true
sandboxd-audit.workspace = true
sandboxd-policy.workspace = true
sandboxd-runtime.workspace = true
sandboxd-server.workspace = true
sandboxd-vfs.workspace = true
sandboxd-net.workspace = true
rmcp.workspace = true
axum.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["signal", "io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
rmcp.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
