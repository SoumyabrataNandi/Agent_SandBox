[workspace]
resolver = "3"
members = [
    "crates/sandboxd-assets",
    "crates/sandboxd-policy",
    "crates/sandboxd-audit",
    "crates/sandboxd-vfs",
    "crates/sandboxd-runtime",
    "crates/sandboxd-server",
    "crates/sandboxd-net",
    "crates/sandboxd",
    "tests/escape-suite",
    "tools/spike-snapshot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/SoumyabrataNandi/Agent_SandBox"
description = "Self-hosted WebAssembly sandbox for running untrusted, agent-generated code"

[workspace.dependencies]
sandboxd-assets = { path = "crates/sandboxd-assets" }
sandboxd-audit = { path = "crates/sandboxd-audit" }
sandboxd-policy = { path = "crates/sandboxd-policy" }
sandboxd-vfs = { path = "crates/sandboxd-vfs" }
sandboxd-runtime = { path = "crates/sandboxd-runtime" }
sandboxd-net = { path = "crates/sandboxd-net" }
sandboxd-server = { path = "crates/sandboxd-server" }

serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "1"
hex = "0.4"
serde_json = "1"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
regex = "1.13"
thiserror = "2"
proptest = "1"
wasmtime = { version = "50.0.2", default-features = false, features = ["runtime", "cranelift", "async", "std", "parallel-compilation", "pooling-allocator"] }
wasmtime-wasi = { version = "50.0.2", default-features = false, features = ["p1"] }
wiggle = { version = "50.0.2", default-features = false }
zip = { version = "9.7", default-features = false, features = ["deflate"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
bytes = "1"
axum = "0.8.9"
tower-http = { version = "0.7", features = ["limit", "trace"] }
tower = "0.5"
rmcp = { version = "3.11", features = ["server", "client", "macros", "transport-io", "transport-streamable-http-server", "transport-child-process", "transport-streamable-http-client-reqwest"] }
clap = { version = "4.6", features = ["derive"] }
prometheus-client = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
schemars = "1.2"
base64 = "0.23"
subtle = "2.6"
futures = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2.5"
rcgen = "0.14"
# Snapshots (cycle 3, ADR-C3-2): must match the wasmtime version exactly.
wasmtime-wizer = { version = "=50.0.2", features = ["wasmtime"] }
# OTLP export (cycle 2, C2-U4): only behind sandboxd-server's `otel` feature. The OTLP HTTP client
# is reqwest 0.13 (blocking), i.e. the same HTTP/TLS stack as the network broker.
opentelemetry = { version = "0.33", default-features = false, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "metrics", "trace", "reqwest-blocking-client"] }

[workspace.lints.rust]
unsafe_code = "deny"            # crates that genuinely need it (vfs, runtime) opt out locally with review
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "deny"

# Optimize dependencies in dev/test: compiling the 32 MB CPython module with an
# unoptimized Cranelift takes minutes; optimized it takes seconds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"                # a guest-triggered host panic must not abort the whole server
