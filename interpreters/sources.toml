# Pinned inputs for the custom snapshot-capable interpreters (cycle 3, ADR-C3-1).
#
# Built only in CI (.github/workflows/interpreters.yml). Every download is verified against its
# sha256. An empty sha256 is allowed only during the C3-U1 spike: the build prints the digest it
# saw, and the digest must be pinned here before C3-U3 (release mode refuses empty pins).

[wasi_sdk]
version = "33"
url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz"
sha256 = ""

[wasmtime_cli]
# Host runner that CPython's WASI build uses to execute the freshly built python.wasm.
version = "50.0.2"
url = "https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.2/wasmtime-v50.0.2-x86_64-linux.tar.xz"
sha256 = ""

[cpython]
# Same version as the upstream asset in assets/manifest.toml, so the stdlib is shared.
version = "3.15.2"
url = "https://www.python.org/ftp/python/3.15.2/Python-3.15.2.tgz"
sha256 = ""

[quickjs]
version = "0.18.0"
url = "https://github.com/quickjs-ng/quickjs/archive/refs/tags/v0.18.0.tar.gz"
sha256 = ""
