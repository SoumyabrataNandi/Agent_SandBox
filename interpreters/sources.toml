# Pinned inputs for the snapshot-capable interpreters (cycle 3, ADR-C3-1).
#
# Built only in CI (.github/workflows/interpreters.yml) with SANDBOXD_INTERP_MODE=release: every
# download must match its sha256 here.
#
# Provenance of the pins (C3-U3 cross-check, 2026-11-19):
#   wasi_sdk, wasmtime_cli: equal to the sha256 digests GitHub publishes for those release assets.
#   cpython:                equal to the sha256 python.org publishes (downloads API, release 3.15.2).
#   quickjs:                GitHub tag archive (no upstream-published digest); pinned from the CI
#                           download. A regenerated archive fails the build instead of changing it.

[wasi_sdk]
version = "33"
url = "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz"
sha256 = "0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce"

[wasmtime_cli]
# Host runner that CPython's WASI build uses to execute the freshly built python.wasm.
version = "50.0.2"
url = "https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.2/wasmtime-v50.0.2-x86_64-linux.tar.xz"
sha256 = "5db0ca8e838ab95a51ba9acdf11f42888bcd0092dda45a86129ae540c4fa952c"

[cpython]
# Same version as the upstream asset in assets/manifest.toml, so the stdlib is shared.
version = "3.15.2"
url = "https://www.python.org/ftp/python/3.15.2/Python-3.15.2.tgz"
sha256 = "f74e1db0eabd651cd01e4e2a00201bd41866abe74869ab716f9bf33cbbaa0943"

[quickjs]
version = "0.18.0"
url = "https://github.com/quickjs-ng/quickjs/archive/refs/tags/v0.18.0.tar.gz"
sha256 = "28bcd89aa3683fd2a946537e5ce3f11cc46b5cbf3383c7561aaef3df5ff9f1dd"
