name: container
# FR-CT1 (cycle 6): build and smoke-test the container image whenever the container files change,
# instead of finding problems only when a release is tagged. Nothing is pushed.
on:
  push:
    branches: [main]
    paths:
      - "packaging/container/**"
      - ".dockerignore"
      - ".github/workflows/container.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "packaging/container/**"
      - ".dockerignore"
      - ".github/workflows/container.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image:
    name: build + smoke test (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: assets/vendor
          key: assets-${{ hashFiles('assets/manifest.toml') }}
      - run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: container
      # The release builds the same target with the same profile.
      - name: Build sandboxd (release, x86_64 Linux)
        run: |
          cargo build --release --locked -p sandboxd
          mkdir -p bin/amd64
          cp target/release/sandboxd bin/amd64/sandboxd
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        run: docker buildx build --platform linux/amd64 --load -t sandboxd-smoke -f packaging/container/Dockerfile .
      - name: Smoke test
        run: bash packaging/container/smoke.sh sandboxd-smoke bin/amd64/sandboxd
