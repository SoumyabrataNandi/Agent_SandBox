name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # GitHub is retiring Node 20 for JavaScript actions: every action below runs on Node 24, and
  # this also moves any action still declaring node20 onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # NFR-1: Linux, macOS and Windows are all first-class.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: assets/vendor
          key: assets-${{ hashFiles('assets/manifest.toml') }}
      - name: Fetch and verify guest assets
        run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: unit + integration tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --exclude sandboxd-escape-suite -- --test-threads=4 2>&1 | tee test.log
      - name: name the test log after the OS
        if: failure()
        shell: bash
        run: '[ -f test.log ] && cp test.log "test-${{ matrix.os }}.log" || true'
      - name: keep the test log (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.os }}
          path: test-${{ matrix.os }}.log
          if-no-files-found: ignore
      - name: smoke
        run: cargo run --locked -p sandboxd -- version
      # FR-PL1 (cycle 4): drive `sandboxd mcp` over stdio the way an agent does. Cold cache, so the
      # first `initialize` also measures first-start cost.
      - name: MCP pilot
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -o pipefail
          python -I scripts/pilot/mcp_pilot.py --sandboxd target/debug/sandboxd --json pilot.json | tee pilot.txt
          { echo '### MCP pilot (${{ matrix.os }})'; echo '```'; cat pilot.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ADR-C3-5: failing test output goes to the `ci-results` branch (`ci/<sha>/<os>.log`) so it can be
  # read with `git fetch`, without the GitHub UI. Pushes to main only; the test jobs stay read-only.
  failure-report:
    name: publish test failures
    needs: [test, escape-suite]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to push the logs to the ci-results branch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: test-log-*
          path: logs
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin ci-results:ci-results 2>/dev/null; then
            git worktree add /tmp/ci-results ci-results
          else
            git worktree add --orphan -b ci-results /tmp/ci-results
          fi
          dest="/tmp/ci-results/ci/${GITHUB_SHA}"
          mkdir -p "$dest"
          # One matching artifact is extracted straight into logs/, several into logs/<name>/.
          find logs -name 'test-*.log' -print0 | while IFS= read -r -d '' f; do
            os="$(basename "$f" .log)"; os="${os#test-}"
            # The failures section plus the tail: enough to diagnose, small enough to keep.
            { grep -A80 -E '^---- ' "$f" | head -2000 || true
              echo '=== tail ==='; tail -n 400 "$f"; } > "$dest/$os.log"
          done
          cd /tmp/ci-results
          git add ci
          git commit -m "ci test failures ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" || exit 0
          git push origin ci-results

  # Release-blocking (NFR-4, AC 10): adversarial isolation tests on every OS.
  escape-suite:
    name: escape suite (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: assets/vendor
          key: assets-${{ hashFiles('assets/manifest.toml') }}
      - run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
      - name: escape suite
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p sandboxd-escape-suite -- --test-threads=4 2>&1 | tee "test-escape-${{ matrix.os }}.log"
      - name: keep the escape-suite log (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-escape-${{ matrix.os }}
          path: test-escape-${{ matrix.os }}.log
          if-no-files-found: ignore

  # FR-O1: the optional `otel` feature builds, lints and exports to a local collector stub; the
  # default build must not contain any OpenTelemetry crate.
  otel:
    name: otel feature
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: assets/vendor
          key: assets-${{ hashFiles('assets/manifest.toml') }}
      - run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
      - name: default build has no OpenTelemetry
        run: |
          if cargo tree --locked -p sandboxd -e normal --prefix none | grep -E '^(opentelemetry|prost)'; then
            echo "OpenTelemetry crates leaked into the default build" >&2
            exit 1
          fi
      - name: clippy (otel)
        run: cargo clippy --locked -p sandboxd -p sandboxd-server --all-targets --features sandboxd/otel,sandboxd-server/otel -- -D warnings
      - name: OTLP export tests
        run: cargo test --locked -p sandboxd-server --features otel -- --test-threads=4

  perf-smoke:
    name: performance smoke (2x NFR-3)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p sandboxd-runtime --test perf -- --ignored --nocapture

  supply-chain:
    name: supply chain (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      # cargo-audit run directly (rustsec/audit-check has no Node 24 release).
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
