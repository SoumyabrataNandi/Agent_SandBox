name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # GitHub is retiring Node 20 for JavaScript actions: every action below runs on Node 24, and
  # this also moves any action still declaring node20 onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # NFR-1: Linux, macOS and Windows are all first-class.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: assets/vendor
          key: assets-${{ hashFiles('assets/manifest.toml') }}
      - name: Fetch and verify guest assets
        run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: unit + integration tests
        run: cargo test --workspace --locked --exclude sandboxd-escape-suite -- --test-threads=4
      - name: smoke
        run: cargo run --locked -p sandboxd -- version

  # Release-blocking (NFR-4, AC 10): adversarial isolation tests on every OS.
  escape-suite:
    name: escape suite (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: assets/vendor
          key: assets-${{ hashFiles('assets/manifest.toml') }}
      - run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
      - name: escape suite
        run: cargo test --locked -p sandboxd-escape-suite -- --test-threads=4

  # FR-O1: the optional `otel` feature builds, lints and exports to a local collector stub; the
  # default build must not contain any OpenTelemetry crate.
  otel:
    name: otel feature
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v5
        with:
          path: assets/vendor
          key: assets-${{ hashFiles('assets/manifest.toml') }}
      - run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
      - name: default build has no OpenTelemetry
        run: |
          if cargo tree --locked -p sandboxd -e normal --prefix none | grep -E '^(opentelemetry|prost)'; then
            echo "OpenTelemetry crates leaked into the default build" >&2
            exit 1
          fi
      - name: clippy (otel)
        run: cargo clippy --locked -p sandboxd -p sandboxd-server --all-targets --features sandboxd/otel,sandboxd-server/otel -- -D warnings
      - name: OTLP export tests
        run: cargo test --locked -p sandboxd-server --features otel -- --test-threads=4

  perf-smoke:
    name: performance smoke (2x NFR-3)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - run: python scripts/fetch-assets.py
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked -p sandboxd-runtime --test perf -- --ignored --nocapture

  supply-chain:
    name: supply chain (cargo-deny + cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      # cargo-audit run directly (rustsec/audit-check has no Node 24 release).
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
