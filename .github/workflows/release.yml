name: release

# Push a tag like v0.1.0 → per-target build, escape suite against each build, draft GitHub Release
# with archives, SHA256SUMS and build-provenance attestations. A maintainer reviews and publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # GitHub is retiring Node 20 for JavaScript actions: every action below runs on Node 24, and
  # this also moves any action still declaring node20 onto Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest,     target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    archive: zip }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - name: Fetch and verify guest assets
        run: python scripts/fetch-assets.py
      - name: Escape suite (release gate)
        run: cargo test --release --locked -p sandboxd-escape-suite -- --test-threads=4
      - name: Build
        run: cargo build --release --locked -p sandboxd --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          name="sandboxd-${ver}-${{ matrix.target }}"
          mkdir -p "dist/${name}/licenses"
          exe=sandboxd; [[ "${{ matrix.target }}" == *windows* ]] && exe=sandboxd.exe
          cp "target/${{ matrix.target }}/release/${exe}" "dist/${name}/"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md THREAT_MODEL.md SECURITY.md CHANGELOG.md "dist/${name}/"
          cp docs/GETTING_STARTED.md "dist/${name}/GETTING_STARTED.md"
          cp docs/MCP.md "dist/${name}/MCP.md"
          cp docs/NETWORK.md "dist/${name}/NETWORK.md"
          cp docs/BENCHMARKS.md "dist/${name}/BENCHMARKS.md"
          python - "dist/${name}/licenses" <<'PY'
          import sys, zipfile, tomllib, pathlib
          out = pathlib.Path(sys.argv[1])
          m = tomllib.loads(pathlib.Path("assets/manifest.toml").read_text())
          z = zipfile.ZipFile(pathlib.Path("assets/vendor") / m["python"]["file"])
          (out / "CPython-LICENSE.txt").write_bytes(z.read("LICENSE"))
          (out / "QuickJS-ng-LICENSE.txt").write_text("MIT License - see https://github.com/quickjs-ng/quickjs/blob/master/LICENSE\n")
          PY
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then 7z a -tzip "${name}.zip" "${name}" >/dev/null; else tar czf "${name}.tar.gz" "${name}"; fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/sandboxd-*.${{ matrix.archive }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/sandboxd-*.${{ matrix.archive }}

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum sandboxd-* > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          # The section for this version: from its "## [x.y.z]" heading to the next "## [" heading.
          awk -v v="$ver" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            on && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $ver" >&2; exit 1; fi
          {
            echo
            echo "---"
            echo "Every archive passed the escape suite on its own target before it was packaged."
            echo "Verify: \`sha256sum --ignore-missing -c SHA256SUMS\` and \`gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}\`."
            echo "Install: [GETTING_STARTED.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/GETTING_STARTED.md)."
          } >> notes.md
          cat notes.md
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
            --title "sandboxd ${GITHUB_REF_NAME}" \
            --notes-file notes.md

  # FR-CI1 (cycle 5): container image from the same Linux binaries that passed the escape suite.
  # Smoke-tested on amd64 before anything is pushed.
  image:
    name: container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-unknown-linux-gnu"
          path: dist
          merge-multiple: true
      - name: Unpack the Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}"; target="${pair#*:}"
            mkdir -p "bin/${arch}" "unpack/${arch}"
            tar xzf "dist/sandboxd-${GITHUB_REF_NAME}-${target}.tar.gz" -C "unpack/${arch}"
            cp "unpack/${arch}/sandboxd-${GITHUB_REF_NAME}-${target}/sandboxd" "bin/${arch}/sandboxd"
          done
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sandboxd" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 for the smoke test
        run: |
          docker buildx build --platform linux/amd64 --load -t sandboxd-smoke -f packaging/container/Dockerfile .
      - name: Smoke test (version, /healthz, one authenticated run)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm sandboxd-smoke version
          out="$(bin/amd64/sandboxd token new --name smoke)"
          token="$(printf '%s\n' "$out" | sed -n '2p' | tr -d ' ')"
          hash="$(printf '%s\n' "$out" | grep -o 'sha256 = "[0-9a-f]*"' | cut -d'"' -f2)"
          docker run -d --name smoke -p 8080:8080 -e SANDBOXD_TOKENS="smoke=${hash}" sandboxd-smoke
          ready=
          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then echo "ready after ${i}s"; ready=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ]; then docker logs smoke; exit 1; fi
            sleep 1
          done
          [ -n "$ready" ] || { echo "not ready after 300 s"; docker logs smoke; exit 1; }
          r="$(curl -fsS -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json'             -d '{"language":"python","code":"print(6*7)"}' http://127.0.0.1:8080/v1/runs)" || { docker logs smoke; exit 1; }
          echo "$r"
          printf '%s' "$r" | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["stdout"]=="42\n", r'
          # Unauthenticated requests are refused.
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"language":"python","code":"1"}' http://127.0.0.1:8080/v1/runs)"
          [ "$code" = 401 ] || { echo "expected 401, got $code"; exit 1; }
          # Not root inside the container.
          [ "$(docker exec smoke id -u)" = 10001 ]
          docker rm -f smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ env.VERSION }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
