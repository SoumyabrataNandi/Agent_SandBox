# cargo-deny policy (NFR-4: security baseline is blocking).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono "unmaintained" (informational, not a vulnerability). It is a *required* dependency of
    # rmcp 3.11 and schemars 1.2 (official MCP SDK); sandboxd never calls it directly. Re-check
    # every cycle; drop this when rmcp/schemars move off chrono. Added 2026-11-19.
    { id = "RUSTSEC-2026-0543", reason = "transitive via rmcp/schemars; no alternative; tracked in THREAT_MODEL R1" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # TLS stack (cycle 2 broker): ring, rustls-webpki, untrusted are ISC;
    # webpki-root-certs (Mozilla root store data) is CDLA-Permissive-2.0. Both OSI-approved permissive.
    "ISC",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path dependencies

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
