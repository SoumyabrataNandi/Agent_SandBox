[package]
name = "spike-adr001"
description = "ADR-001 spike: WASI p1 filesystem interposer over wasmtime-wasi (throwaway)"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
wasmtime = { version = "50.0.2", default-features = false, features = ["runtime", "cranelift", "async", "std"] }
wasmtime-wasi = { version = "50.0.2", default-features = false, features = ["p1"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time"] }
wiggle = { version = "50.0.2", default-features = false }
sandboxd-assets.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
